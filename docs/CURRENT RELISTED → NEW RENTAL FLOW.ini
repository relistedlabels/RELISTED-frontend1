CURRENT RELISTED → NEW RENTAL FLOW

1. REMOVE: Choosing an account type
Currently: When creating an account, Relisted asks:
Who are you joining as? Renter or Buyer / Lister
This is genuinely on the current website.
New: One Relisted account.
A person can rent, buy and eventually list from the same account.
Why: It removes an unnecessary decision before the person has even started transacting and fits the simplified “My Relisted” structure.

2. REMOVE: Full account creation just to start a rental enquiry
Currently: The existing journey pushes the customer into the account/login system as part of progressing with a rental.
New: A customer can browse → choose an item → select dates → Check Availability without creating a full profile.
If they’re not logged in, only ask:
First name Email WhatsApp/phone
Then send the availability check.
Why: We don’t need a complete customer account simply to ask a lister, “Is your UK 8 dress available Sept 12–15?”

3. NAVIGATION FEATURE — MOBILE STICKY BOTTOM NAVIGATION
Add a persistent bottom navigation across the main shopping experience: Home /
Rent / Buy / Saved / Account. This reduces reliance on the hamburger menu and makes switching between Relisted’s core shopping modes significantly faster.
Think of it as:
Bottom navigation = the 5 things customers use constantly.
Hamburger menu = everything else — New In, categories, Style Spotlight, List Your Wardrobe, How It Works, Help/FAQs, Contact, etc.
It also reinforces one of the biggest changes we’re making:
Rent and Buy are two distinct shopping modes within the same Relisted platform.
Customers don’t have to keep opening the hamburger menu to switch between renting and buying, find saved pieces, or access their account.

4. CHANGE: Rental request → Check Availability
Currently: The process behaves like the customer is submitting a rental request that then requires approval.
New CTA:
CHECK AVAILABILITY
Why: This accurately describes what’s happening.
We’re not asking:
“Does the lister approve Kene renting her dress?”
We’re asking:
“Do you physically have your UK 8 dress available for these dates?”
That’s a much lighter interaction.

5. REMOVE: Customer-facing lister/curator approval mechanics
Currently: Approval is part of the journey the customer has to understand and wait for.
New: Hide the internal mechanics.
Customer sees:
We’re checking availability ✨
We’ve asked the lister to confirm the Lumi Dress for Sept 12–15.
We’ll notify you as soon as we hear back. No payment has been taken.
CONTINUE SHOPPING
Why: The customer only needs to know the outcome, not how Relisted manages the lister internally.

6. REMOVE: Making the customer remain in the approval journey
This is one of the biggest UX changes.
New: Once they’ve checked availability, they’re free to leave.
Relisted contacts the lister independently and brings the customer back through WhatsApp/email when there is an answer.
Why: Waiting shouldn’t feel like another checkout step.

7. CHANGE: Lister’s responsibility
We’re not replacing approval with a mandatory lister calendar anymore.
That’s important based on what you told me.
New lister interaction:
New rental request
Lumi Dress — UK 8 Requested: 12–15 Sep
Is this item available?
YES, AVAILABLE NO, NOT AVAILABLE
Ideally accessible directly from WhatsApp/SMS.
Why: Your listers aren’t professional retailers. We shouldn’t expect them to remember to log into Relisted every time they travel, wear something or become unavailable

9. MOVE: Delivery method/address → Checkout
Only after the lister confirms do we ask:
Doorstep Delivery / Pick Up Address Phone
Why: Information is requested at the moment it becomes relevant.

10. REMOVE: “Locked Balance” language
Replace it with:
Refundable security deposit: ₦50,000 ⓘ
The current Relisted site already describes this concept publicly as a “collateral (security deposit)” in its FAQ structure.
Why: “Refundable security deposit” is much easier for a customer to understand than an internal wallet/balance concept.

11. CHANGE: Rental pricing presentation
Instead of making the customer interpret a daily rental amount:
Rent for ₦45,000 3-day rental
Why: The customer immediately understands what this particular rental costs.

12. REMOVE: Approval-management from the cart
No more using the cart as somewhere to monitor:
Request → Pending → Approved → Approved Items → Checkout
New: Once the lister says yes:
It’s available! 🎉
COMPLETE RENTAL
→ Checkout.
Why: A shopping bag should contain things the customer is actually able to transact on.
13. REMOVE: Unnecessary intermediate screens
We don’t need separate screens for every operational action.
The final customer journey becomes only:
① PRODUCT
Rent selected Size shown as UK 8 Select dates CHECK AVAILABILITY
→
② CHECKING
“We’re checking with the lister.” Customer can continue shopping.
→
③ AVAILABLE
“It’s available!” COMPLETE RENTAL
→
④ CHECKOUT
Delivery + Payment
→
⑤ CONFIRMED
Rental booked 🎉
And name + email + WhatsApp is only a small conditional pop-up for a new/not-logged-in customer — not another full step.
One more thing from the actual website I would change
The live homepage currently presents “Find Your Next Fit” and “List Items” together at the top, followed by several occasion/category sections such as Night Out, Brunch Outfits, Special Occasions, Corporate Closet, Vacation and Black Tie.
Based on the new architecture, I’d change that hierarchy too:
[ RENT ] [ SHOP RESALE ]
→ New In/products quickly
→ Shop by Occasion
→ Trending/Most Rented
→ List Your Wardrobe further down
That makes the first decision “How do I want to shop?”, rather than making shopping and becoming a lister compete equally.